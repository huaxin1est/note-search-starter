<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>笔记搜索</title>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1c2943;
            background: #f6f8fc;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 0%, #e9e6ff 0, transparent 34%),
                radial-gradient(circle at 92% 8%, #dff1ff 0, transparent 29%),
                #f6f8fc;
        }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .page-shell { max-width: 1080px; margin: 0 auto; padding: 28px 28px 56px; }
        .topbar, .brand, .mode-tags, .section-heading, .result-top, .result-meta, .examples {
            display: flex;
            align-items: center;
        }
        .topbar { justify-content: space-between; gap: 20px; }
        .brand { gap: 12px; font-size: 16px; font-weight: 750; letter-spacing: .02em; }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(145deg, #7669ee, #4d61cf);
            box-shadow: 0 8px 18px #6259d632;
            font-size: 20px;
        }
        .topbar-note { color: #71809b; font-size: 13px; }
        .hero { padding: 70px 0 34px; }
        .eyebrow, .section-kicker {
            color: #594bd4;
            font-size: 12px;
            font-weight: 750;
            letter-spacing: .14em;
        }
        .eyebrow { display: inline-flex; align-items: center; gap: 9px; }
        .eyebrow-dot { width: 8px; height: 8px; border-radius: 50%; background: #6458df; box-shadow: 0 0 0 4px #6458df1c; }
        .hero h1 {
            margin: 18px 0 16px;
            font-size: clamp(38px, 5.7vw, 66px);
            line-height: 1.16;
            letter-spacing: -.055em;
            font-weight: 800;
        }
        .hero h1 span {
            background: linear-gradient(110deg, #6856dc, #3389bb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-copy { max-width: 620px; margin: 0; color: #66738c; font-size: 16px; line-height: 1.8; }
        .mode-tags { flex-wrap: wrap; gap: 9px; margin-top: 25px; }
        .mode-tags span {
            padding: 7px 12px;
            border: 1px solid #dfe4f1;
            border-radius: 999px;
            background: #ffffffad;
            color: #61708a;
            font-size: 12px;
            font-weight: 600;
        }
        .search-panel {
            position: relative;
            overflow: hidden;
            padding: 28px;
            border: 1px solid #e2e6f1;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 22px 60px #28385a0c, 0 4px 16px #28385a08;
        }
        .search-panel::before {
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            content: "";
            background: linear-gradient(90deg, #6658de, #5b9dd2, #a7d9e7);
        }
        .form-grid { display: grid; grid-template-columns: 195px minmax(0, 1fr) 148px; gap: 14px; align-items: end; }
        .field { display: grid; gap: 9px; min-width: 0; }
        .field label { font-size: 13px; font-weight: 700; color: #3d4a64; }
        .field input, .field select {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #dce3ef;
            border-radius: 12px;
            outline: none;
            color: #202d48;
            background: #f9faff;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }
        .field input::placeholder { color: #9aa5b8; }
        .field input:focus, .field select:focus {
            border-color: #7164e7;
            background: #fff;
            box-shadow: 0 0 0 4px #7164e720;
        }
        .search-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 50px;
            border: 0;
            border-radius: 12px;
            background: #6254dc;
            color: #fff;
            font-size: 14px;
            font-weight: 750;
            box-shadow: 0 10px 20px #6254dc30;
            transition: background .18s, transform .18s;
        }
        .search-button:hover { background: #5041c8; transform: translateY(-1px); }
        .search-button:focus-visible, .example-chip:focus-visible { outline: 3px solid #a8a0f6; outline-offset: 3px; }
        .mode-help { margin: 16px 0 0; color: #71809a; font-size: 13px; line-height: 1.6; }
        .examples { flex-wrap: wrap; gap: 9px; margin-top: 23px; padding-top: 19px; border-top: 1px solid #edf0f6; }
        .examples-label { margin-right: 3px; color: #8a96ac; font-size: 12px; font-weight: 650; }
        .example-chip {
            padding: 7px 11px;
            border: 1px solid #e0e5f0;
            border-radius: 999px;
            background: #fff;
            color: #586782;
            font-size: 12px;
            transition: border-color .18s, color .18s, background .18s;
        }
        .example-chip:hover { border-color: #afa6f1; color: #594bd4; background: #f7f6ff; }
        .results-section { margin-top: 46px; }
        .section-heading { justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 20px; }
        .section-heading h2 { margin: 6px 0 0; font-size: 25px; letter-spacing: -.025em; }
        .result-summary { margin: 0; color: #75829b; font-size: 13px; }
        .result-list { display: grid; gap: 13px; }
        .result-card, .state-card {
            border: 1px solid #e3e8f2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 8px 28px #25365708;
        }
        .result-card { padding: 22px 24px; }
        .result-top { justify-content: space-between; align-items: start; gap: 20px; }
        .result-meta { flex-wrap: wrap; gap: 9px; min-width: 0; }
        .result-rank {
            display: inline-grid;
            place-items: center;
            min-width: 30px;
            height: 30px;
            border-radius: 9px;
            background: #f0efff;
            color: #5d50d1;
            font-size: 12px;
            font-weight: 800;
        }
        .result-file { overflow-wrap: anywhere; font-size: 14px; font-weight: 750; }
        .result-paragraph { color: #8894a9; font-size: 12px; }
        .result-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
        .badge { padding: 6px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .badge-keyword { background: #eaf7ef; color: #21764b; }
        .badge-semantic { background: #eef1ff; color: #4e5cba; }
        .badge-score { background: #f4f6fa; color: #697891; }
        .result-text { margin: 17px 0 0; color: #53617a; font-size: 14px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
        .state-card { display: grid; justify-items: center; padding: 57px 24px; text-align: center; }
        .state-symbol { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 15px; border-radius: 16px; color: #6658d9; background: #f0efff; font-size: 25px; }
        .state-card h3 { margin: 0; font-size: 16px; }
        .state-card p { max-width: 440px; margin: 9px 0 0; color: #8290a6; font-size: 13px; line-height: 1.7; }
        .footer { margin-top: 46px; color: #9aa5b7; font-size: 12px; text-align: center; }
        @media (max-width: 760px) {
            .page-shell { padding: 20px 16px 40px; }
            .topbar-note { display: none; }
            .hero { padding: 52px 0 27px; }
            .hero-copy { font-size: 14px; }
            .search-panel { padding: 22px 18px; }
            .form-grid { grid-template-columns: 1fr; }
            .section-heading { align-items: start; flex-direction: column; gap: 8px; }
            .result-top { flex-direction: column; gap: 12px; }
            .result-badges { justify-content: flex-start; }
            .result-card { padding: 19px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .search-button, .example-chip, .field input, .field select { transition: none; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand"><span class="brand-mark" aria-hidden="true">N</span><span>笔记搜索</span></div>
            <span class="topbar-note">本地学习项目 · FastAPI + 向量检索</span>
        </header>

        <main>
            <section class="hero" aria-labelledby="hero-title">
                <span class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> PERSONAL KNOWLEDGE SEARCH</span>
                <h1 id="hero-title">让每一段笔记<br><span>都能被找到。</span></h1>
                <p class="hero-copy">从精确匹配到语义检索，在自己写下的内容里找到线索。选择搜索方式，输入一个词或一个问题，看看不同方法会给出什么结果。</p>
                <div class="mode-tags" aria-label="支持的搜索方式">
                    <span>关键词匹配</span><span>语义检索</span><span>组合排序</span>
                </div>
            </section>

            <section class="search-panel" aria-label="搜索笔记">
                <form id="search-form">
                    <div class="form-grid">
                        <div class="field">
                            <label for="mode">搜索方式</label>
                            <select id="mode">
                                <option value="hybrid">组合搜索</option>
                                <option value="keyword">关键词搜索</option>
                                <option value="semantic">语义搜索</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="keyword">关键词或问题</label>
                            <input id="keyword" placeholder="例如：地址修正是什么意思？" autocomplete="off">
                        </div>
                        <button class="search-button" type="submit">搜索笔记 <span aria-hidden="true">↗</span></button>
                    </div>
                </form>
                <p id="mode-help" class="mode-help">优先显示直接命中的段落，再用语义结果补足，并标明每条结果的来源。</p>
                <div class="examples">
                    <span class="examples-label">可以试试</span>
                    <button class="example-chip" type="button" data-example="地址修正" data-mode="hybrid">地址修正</button>
                    <button class="example-chip" type="button" data-example="Python" data-mode="keyword">Python</button>
                    <button class="example-chip" type="button" data-example="如何读取中文文件" data-mode="semantic">如何读取中文文件</button>
                </div>
            </section>

            <section class="results-section" aria-labelledby="results-title">
                <div class="section-heading">
                    <div><span class="section-kicker">RESULTS</span><h2 id="results-title">搜索结果</h2></div>
                    <p id="result-summary" class="result-summary" role="status" aria-live="polite">等待你的第一次搜索</p>
                </div>
                <div id="results" class="result-list">
                    <div class="state-card">
                        <span class="state-symbol" aria-hidden="true">⌕</span>
                        <h3>从一个问题开始</h3>
                        <p>输入关键词或点击上方示例，笔记中的相关段落会显示在这里。</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">本地运行 · 笔记内容保存在项目的 notes 文件夹</footer>
    </div>
    <script>
        const input = document.querySelector("#keyword");
        const mode = document.querySelector("#mode");
        const form = document.querySelector("#search-form");
        const results = document.querySelector("#results");
        const summary = document.querySelector("#result-summary");
        const modeHelp = document.querySelector("#mode-help");

        const modeDescriptions = {
            hybrid: "优先显示直接命中的段落，再用语义结果补足，并标明每条结果的来源。",
            keyword: "只查找笔记中直接出现的文字，适合术语、文件名和准确表达。",
            semantic: "按文字意思寻找相近段落；分数用于排序，不代表答案正确概率。",
        };

        mode.addEventListener("change", () => {
            modeHelp.textContent = modeDescriptions[mode.value];
        });

        document.querySelectorAll("[data-example]").forEach((button) => {
            button.addEventListener("click", () => {
                input.value = button.dataset.example;
                mode.value = button.dataset.mode;
                modeHelp.textContent = modeDescriptions[mode.value];
                form.requestSubmit();
            });
        });

        function showState(title, description, symbol = "⌕") {
            results.replaceChildren();
            const card = document.createElement("div");
            card.className = "state-card";
            const icon = document.createElement("span");
            icon.className = "state-symbol";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = symbol;
            const heading = document.createElement("h3");
            heading.textContent = title;
            const detail = document.createElement("p");
            detail.textContent = description;
            card.append(icon, heading, detail);
            results.appendChild(card);
        }

        function addResultCard(item, index, selectedMode) {
            const card = document.createElement("article");
            card.className = "result-card";
            const top = document.createElement("div");
            top.className = "result-top";
            const meta = document.createElement("div");
            meta.className = "result-meta";
            const rank = document.createElement("span");
            rank.className = "result-rank";
            rank.textContent = String(index + 1).padStart(2, "0");
            const file = document.createElement("strong");
            file.className = "result-file";
            file.textContent = item.file;
            const paragraph = document.createElement("span");
            paragraph.className = "result-paragraph";
            paragraph.textContent = `第 ${item.paragraph} 段`;
            meta.append(rank, file, paragraph);

            const badges = document.createElement("div");
            badges.className = "result-badges";
            const source = document.createElement("span");
            const fromKeyword = item.source === "keyword" || selectedMode === "keyword";
            source.className = `badge ${fromKeyword ? "badge-keyword" : "badge-semantic"}`;
            source.textContent = fromKeyword ? "关键词命中" : selectedMode === "hybrid" ? "语义补充" : "语义匹配";
            badges.appendChild(source);
            if (typeof item.score === "number") {
                const score = document.createElement("span");
                score.className = "badge badge-score";
                score.textContent = `相似度 ${item.score.toFixed(3)}`;
                badges.appendChild(score);
            }
            top.append(meta, badges);

            const text = document.createElement("p");
            text.className = "result-text";
            text.textContent = item.text;
            card.append(top, text);
            results.appendChild(card);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const keyword = input.value.trim();
            if (!keyword) {
                summary.textContent = "请输入内容后搜索";
                showState("还没有输入内容", "输入一个关键词或问题，然后按回车或点击搜索笔记。", "!");
                input.focus();
                return;
            }

            const selectedMode = mode.value;
            let url;
            if (selectedMode === "semantic") {
                url = `/semantic-search?query=${encodeURIComponent(keyword)}`;
            } else if (selectedMode === "hybrid") {
                url = `/hybrid-search?query=${encodeURIComponent(keyword)}`;
            } else {
                url = `/search?keyword=${encodeURIComponent(keyword)}`;
            }

            summary.textContent = "正在查找…";
            showState("正在搜索笔记", "马上就好，正在检查相关段落。", "…");
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || "搜索失败");
                }
                if (!Array.isArray(data.results)) {
                    throw new Error("接口没有返回结果列表");
                }

                if (selectedMode === "keyword") {
                    summary.textContent = `直接命中 ${data.count} 段`;
                } else if (selectedMode === "semantic") {
                    summary.textContent = `最相关的 ${data.results.length} 段`;
                } else {
                    summary.textContent = `组合搜索返回 ${data.results.length} 段`;
                }

                results.replaceChildren();
                if (data.results.length === 0) {
                    showState("暂时没有找到", "可以换个说法，或试试组合搜索。", "—");
                    return;
                }
                data.results.forEach((item, index) => addResultCard(item, index, selectedMode));
            } catch (error) {
                console.error(error);
                summary.textContent = "搜索未完成";
                showState("暂时无法搜索", "请确认服务仍在运行，然后重试。", "!");
            }
        });
    </script>
</body>
</html>
